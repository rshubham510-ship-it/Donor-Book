name: Extract APK Source

on:
  push:


jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.0/apktool_2.9.0.jar
          sudo mv apktool_2.9.0.jar /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

      - name: Decompile APK
        run: |
          apktool d app-release.apk -o extracted_source

      - name: Commit extracted source
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add extracted_source/
          git commit -m "Extracted source from APK" || echo "No changes to commit"
          git push
