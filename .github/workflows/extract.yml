name: Extract APK Source
on:
  workflow_dispatch:
  push:
    paths: ['trigger.txt']

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download apktool and jadx
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -L -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx.zip -d jadx

      - name: Decode resources and smali (apktool)
        run: java -jar apktool.jar d app-release.apk -o out/apktool -f

      - name: Decompile to Java (jadx)
        run: jadx/bin/jadx -d out/jadx app-release.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: apk-source
          path: out
